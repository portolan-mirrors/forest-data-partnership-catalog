name: Publish

# Publishes the catalog metadata (everything under catalog/) to Source Cooperative
# when main changes, and on demand.
#
# The STAC is regenerated from tools/data/ first, and the job stops if the result
# differs from the committed files, so what publishes is exactly what was reviewed.
# items.parquet is gitignored, so it is rebuilt here too.
#
# Credentials: GitHub OIDC assumes the IAM role Source Cooperative approved for the
# portolan-mirrors organization (as portolan-mirrors/firms-catalog does). The role's
# trust policy must list this repository. Data files (tiles, thumbnails, overviews)
# are not uploaded here; they are already in the bucket.

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "tools/**"
      - "catalog.publish.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'portolan-mirrors/forest-data-partnership-catalog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the AWS role
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the generator and validators
        run: python -m pip install 'portolan-cli==0.8.0' 'rashid>=0.1.8,<0.2.0' stac-check boto3

      - name: Regenerate the STAC and check it matches the commit
        run: |
          python3 tools/build_catalog.py
          git diff --exit-code -- catalog/ || {
            echo "::error::catalog/ differs from what tools/build_catalog.py generates. Rebuild and commit."
            exit 1
          }

      - name: Build items.parquet
        run: |
          portolan stac-geoparquet --catalog catalog
          python3 tools/build_catalog.py --register-parquet
          git diff --exit-code -- catalog/ || {
            echo "::error::registering items.parquet changed committed files. Rebuild locally and commit."
            exit 1
          }

      - name: Run the gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          aws-region: us-west-2

      - name: Publish
        run: python3 tools/publish.py --confirm
