name: Publish

# Publishes the catalog metadata (everything under catalog/) to Source Cooperative
# when main changes, and on demand.
#
# Two jobs, so third-party packages never run next to the AWS credentials:
#
# - build (no credentials): installs the generator and validators, regenerates the
#   STAC from tools/data/ and stops if it differs from the commit, rebuilds
#   items.parquet (gitignored), runs the gates, and hands catalog/ over as an artifact.
# - publish (AWS role): installs only boto3 and its dependencies, pinned with hashes
#   in tools/requirements-publish.txt, and runs tools/publish.py --confirm on the
#   artifact.
#
# Credentials: GitHub OIDC assumes the IAM role Source Cooperative approved for the
# portolan-mirrors organization (as portolan-mirrors/firms-catalog does). No secret.
# The role's trust policy must list this repository. Data files (tiles, thumbnails,
# overviews) are not uploaded here; they are already in the bucket.

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "tools/**"
      - "catalog.publish.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'portolan-mirrors/forest-data-partnership-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the generator and validators
        run: python -m pip install 'portolan-cli==0.8.0' 'rashid>=0.1.8,<0.2.0' stac-check

      - name: Regenerate the STAC and check it matches the commit
        run: |
          python3 tools/build_catalog.py
          git diff --exit-code -- catalog/ || {
            echo "::error::catalog/ differs from what tools/build_catalog.py generates. Rebuild and commit."
            exit 1
          }

      - name: Build items.parquet
        run: |
          portolan stac-geoparquet --catalog catalog
          python3 tools/build_catalog.py --register-parquet
          git diff --exit-code -- catalog/ || {
            echo "::error::registering items.parquet changed committed files. Rebuild locally and commit."
            exit 1
          }

      - name: Run the gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog
          path: catalog/
          include-hidden-files: false
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the AWS role
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Replace catalog/ with the validated build
        run: rm -rf catalog

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog
          path: catalog

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install boto3 (pinned, hash-checked)
        run: python -m pip install --require-hashes --no-deps -r tools/requirements-publish.txt

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          aws-region: us-west-2

      - name: Publish
        run: python3 tools/publish.py --confirm
