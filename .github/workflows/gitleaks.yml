name: Secret scan

# Scans the whole git history for leaked secrets (keys, tokens, private keys) on
# every push to any branch and on every pull request. A finding fails the job.
#
# Runs the gitleaks CLI directly: gitleaks/gitleaks-action needs a paid license key
# for organization repositories. The release archive is verified against its
# published SHA-256 before it runs. To upgrade, change both GITLEAKS_VERSION and
# GITLEAKS_SHA256 (from gitleaks_<version>_checksums.txt on the release page).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0              # full history: a secret removed later is still leaked
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
