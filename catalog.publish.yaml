# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
#
# Source Cooperative serves these objects. data.source.coop returns raw bytes.
# source.coop renders the human-facing page.

# The S3 URI uploads are written to, through the data.source.coop gateway: the
# Source Cooperative account is the bucket and the product is the key prefix.
# Credentials come from `source-coop creds` (see profile below).
write_prefix: s3://portolan-mirrors/forest-data-partnership-catalog

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
public_base: https://data.source.coop/portolan-mirrors/forest-data-partnership-catalog

region: us-west-2

# The gateway is S3-compatible, so every request goes to it.
endpoint_url: https://data.source.coop

# The named AWS profile the publisher uses. It runs `source-coop creds` as a
# credential_process, which refreshes the temporary credentials on expiry:
#
#   [profile source-coop]
#   credential_process = source-coop creds
#   endpoint_url = https://data.source.coop
profile: source-coop

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

# The staging directory that holds data files, read by tools/upload_data.py:
# the thumbnails (<collection>/<tile>/<tile>.thumb.jpg) and the overview COGs
# (<collection>/<collection>_overview.tif). It mirrors the catalog layout.
# The mirrored tiles themselves were copied by the transfer scripts, not from here.
data_dir: ../catalog-staging/publish
